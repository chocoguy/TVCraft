# TVCraft: Minecraft PE 0.8.1 for Apple TV (xcodegen). scripts/tvcraft.py build generates and builds it; run "tvcraft.py extract" first.
# Modelled on TVPort's dm/ios/project_tv.yml. The game code is the MCPE-0.8.1-fortv submodule; the assets and sounds come from your own APK (tvos/staging).
name: TVCraft
options:
  deploymentTarget:
    tvOS: "26.0"
  groupSortPosition: top
fileGroups: [THIRD_PARTY.md]
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: gnu++11   # the decompilation's standard (CMakeLists.txt)
    GCC_C_LANGUAGE_STANDARD: gnu11
    USE_HEADERMAP: NO                       # the game has headers named like system and library ones; only the search paths below decide
    ALWAYS_SEARCH_USER_PATHS: NO
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/shim
      - $(SRCROOT)/../MCPE-0.8.1-fortv/minecraftpe/headers
      - $(SRCROOT)/../MCPE-0.8.1-fortv/glm
      - $(SRCROOT)/../MCPE-0.8.1-fortv/OpenAES/inc
      - $(SRCROOT)/../MCPE-0.8.1-fortv/RakNet/Source
      - $(SRCROOT)/../MCPE-0.8.1-fortv/jsoncpp/jsoncpp/include
      - $(SRCROOT)/../MCPE-0.8.1-fortv/jsoncpp/jsoncpp/src/lib_json
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - USEGLES                    # OpenGL ES 1.1, as on Android
      - USEOPENAL                  # SoundSystemAL through OpenAL.framework
      - TVTWEAKS                   # tvOS input and screen changes
      - NOCURL                     # tvOS has no curl; Realms (MCO) requests fail as network errors
      - IMTOOLAZYTOFIX16ERRS
      - DIFFERENTTWEAKS
      - GLES_SILENCE_DEPRECATION
      - OPENAL_DEPRECATED=
    OTHER_CFLAGS:
      - $(inherited)
      - -funsigned-char            # char is unsigned on the original ARM build; Apple's arm64 has it signed
      - -Wno-out-of-line-declaration
      - -Wno-write-strings
      - -Werror=return-type
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64   # Apple silicon Macs only
targets:
  TVCraft:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: ../MCPE-0.8.1-fortv/minecraftpe/impl
        excludes:
          - "android/**"
          - "AppPlatform_sdl.cpp"
          - "main.cpp"
          - "sound/SoundSystemDirectSound.cpp"
          - "sound/SoundSystemSL.cpp"
      - path: ../MCPE-0.8.1-fortv/RakNet/Source
        excludes: ["CMakeLists.txt", "*.vcproj"]
      - path: ../MCPE-0.8.1-fortv/jsoncpp/jsoncpp/src/lib_json
        includes: ["*.cpp"]
      - path: ../MCPE-0.8.1-fortv/OpenAES/src/oaes_lib.c
        compilerFlags: "-Wno-incompatible-function-pointer-types -Wno-int-conversion"
      - path: ../MCPE-0.8.1-fortv/OpenAES/src/isaac/rand.c
      - path: staging/pcm_data.c          # the sounds, generated from your APK by tvcraft.py extract
        optional: true
      - path: staging/Assets.xcassets     # the layered icon and Top Shelf images, made by tvcraft.py extract (tools/tv_icon.swift)
        optional: true
      - path: staging/assets              # copied as <app>/assets: the game reads assets/... relative to the bundle (main.mm changes into it)
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: OpenGLES.framework
      - sdk: OpenAL.framework
      - sdk: GameController.framework
      - sdk: AVFAudio.framework
      - sdk: QuartzCore.framework
      - sdk: libz.tbd
      - sdk: libcompression.tbd
    info:
      path: Generated/Info.plist   # written by xcodegen (git-ignored)
      properties:
        CFBundleDisplayName: Minecraft PE
        CFBundleShortVersionString: "0.8.1"
        CFBundleVersion: "1"
        UIRequiredDeviceCapabilities: [arm64]
        GCSupportsControllerUserInteraction: true   # physical controllers (GameController)
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        UIApplicationSceneManifest:                  # UIKit stops an app built with this SDK that has no scene lifecycle
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    settings:
      PRODUCT_NAME: TVCraft
      PRODUCT_BUNDLE_IDENTIFIER: ${TVCRAFT_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${TVCRAFT_TEAM}
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "3"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # AppIcon.brandassets: tvOS's layered icon and its Top Shelf images
schemes:
  TVCraft:
    build:
      targets:
        TVCraft: all
    run:
      config: Release
    archive:
      config: Release
